# Applied as a config group over the official dapo_trainer primary config.
# The official recipe remains the owner of defaults and training behavior.

data:
  train_files: ${oc.env:CPT_WORLD_TRAIN_DATA}
  val_files: ${oc.env:CPT_WORLD_VAL_DATA}
  train_batch_size: 1
  # The official recipe truncates surplus retained prompts to train_batch_size.
  # Match the verified run-02 path; dynamic filtering generates again if needed.
  gen_batch_size: ${data.train_batch_size}
  val_batch_size: 5
  max_prompt_length: 2048
  max_response_length: 30720
  shuffle: false
  seed: 42
  dataloader_num_workers: 0
  filter_overlong_prompts: false
  truncation: error
  apply_chat_template_kwargs:
    enable_thinking: false

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  # Official decoupled_token_is preset. BF16 vLLM and FSDP need not evaluate
  # the same weights identically. Retain DAPO's clipped objective and apply
  # upstream token TIS; clipping and token-wise correction remain biased.
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false
    rollout_rs: null
    rollout_rs_threshold: null
    bypass_mode: false
    loss_type: ppo_clip
  kl_ctrl:
    kl_coef: 0.0
  filter_groups:
    enable: true
    metric: acc
    max_num_gen_batches: 10

actor_rollout_ref:
  model:
    path: ${oc.env:CPT_WORLD_MODEL}
    lora_rank: 8
    lora_alpha: 32
    # Historical RL checkpoints were disqualified by the user on 2026-09-06.
    # Audit from the original base model with a newly initialized adapter.
    lora_adapter_path: null
    target_modules: all-linear
    exclude_modules: '.*(?:visual|vision|aligner|multi_token_predictor|mtp|lm_head).*'
    enable_gradient_checkpointing: true
    use_remove_padding: false
    use_fused_kernels: true
    fused_kernel_options:
      # The pinned Triton backend returns flattened scores, incompatible with
      # FSDP's non-remove-padding output contract. Official torch preserves it.
      impl_backend: torch
    override_config:
      attn_implementation: sdpa
  actor:
    strategy: fsdp2
    ppo_mini_batch_size: 1
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    use_dynamic_bsz: false
    use_torch_compile: false
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    loss_agg_mode: token-mean
    grad_clip: 1.0
    checkpoint:
      save_lora_only: true
    optim:
      lr: 1.0e-6
      lr_warmup_steps: 0
      lr_warmup_steps_ratio: 0.0
      weight_decay: 0.1
    fsdp_config:
      model_dtype: bfloat16
      fsdp_size: 1
      # Keep the frozen base on GPU; vLLM already keeps a CPU sleep backup.
      # Two additional CPU base copies exceeded this server's 64 GiB RAM.
      param_offload: false
      optimizer_offload: true
      offload_policy: false
      use_torch_compile: false
  rollout:
    name: vllm
    load_format: safetensors
    layered_summon: true
    n: 4
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.5
    max_model_len: 32768
    max_num_seqs: 4
    max_num_batched_tokens: 8192
    enforce_eager: true
    enable_prefix_caching: true
    free_cache_engine: true
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    agent:
      num_workers: 1
      default_agent_loop: tool_agent
    multi_turn:
      enable: true
      format: qwen3_coder
      max_parallel_calls: 1
      max_tool_response_length: 131072
      tool_config_path: ${oc.env:CPT_WORLD_PROJECT}/configs/verl/cpt_world_tools.yaml
    val_kwargs:
      n: 1
      temperature: 1.0
      top_p: 1.0
      top_k: -1
      do_sample: true

reward:
  num_workers: 1
  custom_reward_function:
    path: ${oc.env:CPT_WORLD_PROJECT}/src/cpt_world/verl_environment.py
    name: compute_score
  reward_manager:
    source: importlib
    name: CPTWorldRewardMetadata
    module:
      path: ${oc.env:CPT_WORLD_PROJECT}/src/cpt_world/verl_environment.py
  reward_kwargs:
    max_resp_len: ${data.max_response_length}
    overlong_buffer_cfg:
      enable: true
      len: 4096
      penalty_factor: 1.0
      log: true

trainer:
  use_v1: false
  project_name: cpt-world-dapo
  experiment_name: official-dapo
  logger: [console]
  n_gpus_per_node: 1
  nnodes: 1
  balance_batch: false
  val_before_train: false
  total_epochs: 1
  total_training_steps: 1
  test_freq: -1
  save_freq: 1
  max_actor_ckpt_to_keep: 2
  resume_mode: disable
  default_local_dir: ${oc.env:CPT_WORLD_RUN_DIR}/checkpoints
  rollout_data_dir: ${oc.env:CPT_WORLD_RUN_DIR}/rollouts

ray_kwargs:
  ray_init:
    num_cpus: 8
    include_dashboard: false
