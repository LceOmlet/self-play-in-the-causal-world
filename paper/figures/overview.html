<!DOCTYPE html>
<!--
  DoLens Figure 1 : the method engine.
  Canonical source of record. Export with:  python scripts/build_overview_figure.py
  Verify geometry with:                     python scripts/check_overview_layout.py
  Fixed canvas 1200 x 776 px. Local TrueType fonts only, no network assets.

  Included at \linewidth = 5.5in, so 1200 px maps to 396 pt: 1 px = 0.33 pt.
  The smallest type is 20 px = 6.6 pt on the printed page.

  Reading path is a spiral, so every connector is short and none cross:
      1 world (TL) -> 2 surface (TR) -> 3 episode (BR) -> 4 engine (BL) -> 5 strip
  Grid: columns 14-585 | gutter 30 | 615-1186
        rows    14-268 | 288-588 | strip 612-762
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/* TrueType, not OTF: Chrome's print-to-PDF turns CFF outlines into Type 3 fonts. */
@font-face{font-family:"FigSans";src:url("fonts/texgyreheros-regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"FigSans";src:url("fonts/texgyreheros-bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:"FigMath";src:url("fonts/texgyretermes-italic.ttf") format("truetype");font-weight:400;font-style:italic;font-display:block}
@font-face{font-family:"FigMath";src:url("fonts/texgyretermes-bolditalic.ttf") format("truetype");font-weight:700;font-style:italic;font-display:block}
@font-face{font-family:"FigMath";src:url("fonts/texgyretermes-regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"FigMath";src:url("fonts/texgyretermes-bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:block}

:root{
  --ink:#16191d;      /* prose and labels        */
  --mute:#5a636c;     /* secondary annotation    */
  --world:#2E6F3E;    /* 1 sealed world          */
  --surf:#8a5c12;     /* 2 evidence surface      */
  --epi:#2F6690;      /* 3 episode               */
  --eng:#A23B3B;      /* 4 engine, 5 verdict     */
  --extra:#3f464e;    /* assumptions the world does not supply */
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:776px;overflow:hidden;background:#fff}
body{font-family:"FigSans",sans-serif;color:var(--ink);font-synthesis:none}
@page{size:1200px 776px;margin:0}
svg{display:block}
text{font-family:"FigSans",sans-serif;font-synthesis:none;fill:var(--ink)}
/* px -> printed pt at 5.5in: x 0.33 */
.t-tag  {font-size:20px;font-weight:700;letter-spacing:.1em}   /* 6.6pt */
.t-title{font-size:30px;font-weight:700}                       /* 9.9pt */
.t-sub  {font-size:21px;fill:var(--mute)}                      /* 6.9pt */
.t-claim{font-size:22px;font-weight:700}                       /* 7.3pt */
.t-lab  {font-size:21px}                                       /* 6.9pt */
.t-small{font-size:20px;fill:var(--mute)}                      /* 6.6pt */
.m      {font-family:"FigMath",serif;font-style:italic;font-weight:700;font-synthesis:none}
.mu     {font-family:"FigMath",serif;font-style:normal;font-synthesis:none}
</style>
</head>

<svg id="fig" width="1200" height="776" viewBox="0 0 1200 776"
     role="img"
     aria-label="The DoLens method engine in five stages arranged as a spiral. Stage one, the hidden CPT world: a sealed finite directed acyclic graph over four variables, with a confounder Z above X and Y and a mediator M between them, carries finite-state conditional probability table rows and fixes one causal truth before the model acts, so worlds with the same legal laws force the same accepted answer. Stage two, the controlled experimental surface: rendering seals the mechanism and the edges and renames the same four variables to opaque three-letter labels, exposing only K legal do targets and a readout width M, so evidence access varies while the causal truth does not. Stage three, the active episode loop: the model picks a probe and the environment draws independent units, the experiment being a hard intervention or an observation together with a readout of width at most M on a chosen batch size, and only the requested joint counts return, with omitted cells exactly zero. Stage four, the DoLens probability engine answers every request with batch counts and returns the terminal verdict for five terminal objects: total effect, individual counterfactual probability, experimental decision, causal adjustment set, and mediator structure, so feedback and verdict share one semantics. Stage five, the individual counterfactual check: endpoint marginals and an observed factual outcome give the universal Frechet outer interval from 0.75 to 1; the exact task verifier optimizes over complete mechanisms compatible with the DAG and every CPT row and can tighten this interval.">

<script>
// Export gate: assert every face the figure actually draws with, so a silent
// fallback can never reach the PDF. Variables are bold italic; numerals,
// parentheses and the upright "do" operator come from the roman math faces.
(async () => {
  await document.fonts.ready;
  const required = [
    '400 20px "FigSans"', '700 30px "FigSans"',
    'italic 700 23px "FigMath"', '400 23px "FigMath"',
  ];
  const missing = required.filter(f => !document.fonts.check(f));
  if (missing.length) {
    document.title = "FONT-ERROR " + missing.join(" | ");
    throw new Error("figure fonts did not load: " + missing.join(", "));
  }
  document.documentElement.setAttribute("data-fonts", "ready");
})();
</script>
