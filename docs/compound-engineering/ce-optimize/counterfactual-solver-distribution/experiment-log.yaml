hypothesis_backlog:
  - description: >
      Extend the exact one-mediator transport class to arbitrary unaffected
      mediator parents by conditioning on their shared configuration and
      solving independent exact transports. The current dispatcher was called
      39 times and accepted only one instance because it requires parents[M]=(X,).
    category: exact-decomposition
    priority: medium
    dep_status: approved
    required_deps: []
  - description: >
      For the complete non-direct two-mediator class, enumerate the bounded
      terminal response-coupling vertices and solve the existing exact layered
      owner for each vertex instead of falling back to the generic polynomial
      model. Apply only where the finite vertex set is explicitly enumerable.
    category: exact-decomposition
    priority: medium
    dep_status: approved
    required_deps: []
  - description: >
      Decompose a two-mediator response LP whose nonzero pairwise interaction
      graph is a forest into edge transportation problems with consistent
      unary marginals. Tree-consistent pairwise marginals admit a joint owner,
      so the reduction is exact. Measure forest coverage before implementation.
    category: exact-decomposition
    priority: medium
    dep_status: approved
    required_deps: []
  - description: >
      Reuse one upstream response-coupling owner for both direct-terminal
      endpoints while keeping separate terminal arithmetic circuits. This
      removes duplicated context graphs, kernels, columns, and pricing state;
      retain only if the larger shared model improves certified closure.
    category: formulation
    priority: low
    dep_status: approved
    required_deps: []
  - description: >
      Restrict response choices and transport entries to positive CPT support.
      Zero-marginal response states have exactly zero feasible mixture weight,
      so removal is semantics-preserving. Measure effective-support reduction
      before implementation because the current generator is usually dense.
    category: formulation
    priority: low
    dep_status: approved
    required_deps: []
  - description: >
      Reduce zero coefficient insertions, add unary-only MAP dispatch, and cache
      min-fill orders by pairwise edge signature. Pricing callbacks consume only
      2.8 aggregate seconds, so this remains a low-priority scaling safeguard
      and cannot displace structural closure work.
    category: algorithm
    priority: low
    dep_status: approved
    required_deps: []
