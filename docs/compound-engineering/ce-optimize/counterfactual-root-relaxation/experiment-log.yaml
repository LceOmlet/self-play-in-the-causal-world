baseline:
  distribution:
    closed: 23
    exact: 22
    epsilon_sharp: 1
    unresolved: 7

aggregate_diagnosis:
  unresolved_root_nodes_at_most_one: 6
  unresolved_dual_lagging: 7
  unresolved_dual_progress_at_most_one_percent: 5
  unresolved_models_over_5000_variables: 5
  unresolved_all_dynamic_blocks_within_existing_3125_column_limit: 2
  unresolved_symbolic_product_max_arity_at_most_two: 7
  unresolved_high_arity_product_fraction: 0.0
  interpretation: >
    The dominant failures stall while processing the root nonlinear master.
    Branch selection, local response pricing, and a single enormous local
    response table are not the common bottleneck.

experiments:
  - id: upstream-rlt-filter-release
    change: >
      Allow SCIP RLT to use relaxation auxiliaries and rows with unknown
      bilinear terms.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 418.7679405999952
    p95_seconds: 147.27141230000416
    decision: reject
    reason: no closure gain and additional separation work

  - id: single-shared-variable-stratified-frechet
    shadow:
      strictly_tightened: 20
      old_width_median: 0.17454655148076442
      new_width_median: 0.10189874866137845
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 681.8287285001134
    p95_seconds: 159.43156080000335
    decision: reject
    reason: mathematically tighter outer bounds did not improve certification

  - id: scip-quadratic-intersection-cuts
    change: enable the official quadratic intersection-cut handler at the root
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 418.88430470001185
    p95_seconds: 147.11745979997795
    decision: reject
    reason: no closure gain

  - id: materialize-small-wide-response-blocks
    change: >
      Materialize response blocks with more than five contexts when their
      complete response count remains within the existing 3125-column limit.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 455.5496765002026
    p95_seconds: 180.97469050000655
    decision: reject
    reason: no closure gain and worse tail latency

  - id: opposite-endpoint-reoptimization
    change: >
      Use official SCIP reoptimization only for a reused joint model when its
      objective flips from the lower to the upper endpoint.
    distribution: {closed: 23, exact: 21, epsilon_sharp: 2, unresolved: 7}
    total_seconds: 304.68441509990953
    p95_seconds: 42.61363809998147
    decision: reject_for_closure_goal
    reason: substantial runtime improvement but no additional certificate

  - id: upstream-nonlinear-obbt
    change: >
      Enable SCIP's official nonlinear optimization-based bound tightening at
      the root before the unchanged bilinear relaxation.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 475.3831437000772
    p95_seconds: 173.27341099997284
    decision: reject
    reason: no closure gain and severe tail-latency regression

  - id: propagated-message-frechet-lower-bounds
    change: >
      Propagate exact local Frechet lower bounds through the nonnegative
      elimination circuit instead of assigning zero to every message lower
      bound.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 281.5367622997146
    p95_seconds: 25.78989209997235
    decision: reject_for_closure_goal
    reason: runtime improved, but the certified set did not grow

  - id: affine-message-inlining
    change: >
      Inline only elimination messages whose terms contain at most one
      symbolic factor, retaining auxiliaries for every true bilinear message.
    decision: reject_before_cohort
    reason: >
      The focused exact-owner suite exceeded 60 seconds at the same test that
      takes about 12 seconds on the baseline because downstream products
      expanded the affine expressions.

  - id: remove-dependent-coupling-rows
    change: >
      Remove the final implied marginal equation from response-mixture and
      forest-transport coupling blocks.
    decision: reject_before_cohort
    reason: >
      Both the combined candidate and the forest-only variant exceeded 60
      seconds in the focused exact-owner suite; the alternative LP basis made
      pricing or root processing substantially slower.

  - id: bilinear-aware-elimination-order
    shadow:
      unresolved_nonlinear_term_ratio_median: 0.1890909090909091
      unresolved_nonlinear_term_ratio_max: 0.47368421052631576
      unresolved_bilinear_aux_ratio_median: 0.0823045267489712
      unresolved_bilinear_aux_ratio_max: 0.39285714285714285
      unresolved_peak_bilinear_aux_ratio_median: 0.08
      unresolved_peak_bilinear_aux_ratio_max: 0.5
    change: >
      Select exact variable-elimination steps by immediate bilinear term count
      before using message size as the deterministic tie-breaker.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 171.38869850017363
    p95_seconds: 56.70978600002127
    decision: reject_for_closure_goal
    reason: large circuit-size and runtime reductions did not increase closure
    tolerance_recheck:
      conditional_endpoint_tolerance: 0.001
      distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
      total_seconds: 177.3118135999539
      closure_contingency:
        both_closed: 23
        baseline_only: 0
        candidate_only: 0
        both_unresolved: 7
      decision: reject

  - id: bilinear-aware-order-plus-message-lower-bounds
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 212.6318019000464
    p95_seconds: 59.12437949999003
    decision: reject
    reason: the complementary size and box-bound improvements had no closure gain

  - id: upstream-external-spatial-branching
    change: >
      Let SCIP register nonlinear external branching candidates for its generic
      branching rules.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 421.3550205999054
    p95_seconds: 147.83756170002744
    decision: reject
    reason: no closure gain and no reduction of the root-dominated tail

  - id: bilinear-aware-order-plus-external-branching
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 172.995445299719
    p95_seconds: 56.549373999994714
    decision: reject
    reason: shrinking the circuit did not make spatial branching certify another task

  - id: attained-outer-endpoint-certificate
    change: >
      Certify exactness when a feasible primal mechanism attains the globally
      valid target outer endpoint.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 295.6956551000476
    p95_seconds: 25.016723300039303
    decision: reject_for_closure_goal
    reason: none of the unresolved feasible primal values attained an outer endpoint

  - id: outer-primal-epsilon-certificate
    change: >
      Use the safe bracket between a global outer endpoint and a feasible
      primal mechanism when its width is within the unchanged endpoint
      tolerance.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 478.6822940001148
    p95_seconds: 161.62175580003532
    decision: reject_for_closure_goal
    reason: no unresolved outer-primal bracket was within the existing tolerance

  - id: upstream-projected-hidden-rlt
    change: >
      Enable projected-row checks, hidden-product detection, hidden RLT cuts,
      and auxiliary-row participation in SCIP's official RLT separator.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 315.8057668999536
    p95_seconds: 29.129727699968498
    decision: reject
    reason: stronger official RLT separation did not increase closure

  - id: binary-single-edge-response-vertex-decomposition
    change: >
      Enumerate the two exact Frechet vertices of the only binary response
      mechanism whose queried context graph contains one edge, then solve the
      remaining mechanisms under the same combined endpoint budget.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    decision: reject
    reason: >
      The complete structural class remained unresolved and the dispatcher
      added model-build and diagnostic overhead without a new certificate.

  - id: indirect-one-mediator-compact-projection
    change: >
      Project a pure indirect X-to-M-to-Y twin world onto exact mediator
      transports and terminal response laws.  Test explicit response columns,
      on-demand response pricing, and an exact distributive aggregation from
      shared assignments to P(B,M0,M1) before the remaining bilinear product.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    decision: reject
    reason: >
      Explicit columns and the unaggregated target each reached about 1.7 GB
      before useful solving.  On-demand columns plus exact shared-assignment
      aggregation removed that resource explosion and correctly took ownership
      of the wide two-mechanism class, but it still produced no endpoint
      certificate within five seconds.

  - id: layered-explicit-objective-to-existing-pricer
    change: >
      Route a layered two-mediator problem to the existing exact priced
      response LP when explicit objective evaluation exceeds the existing
      ten-million-evaluation guard.
    distribution: {closed: 22, exact: 22, epsilon_sharp: 0, unresolved: 8}
    decision: reject
    reason: >
      The near-tolerance layered instance was actually blocked by the upstream
      4096-vertex-product guard, while the broader route caused one previously
      closed task to time out.

  - id: compact-two-mediator-continuous-upstream-projection
    change: >
      Replace the Cartesian product of upstream transport vertices by
      continuous transport tables, linearly aggregate shared-parent terminal
      costs, and retain only their products with exactly priced downstream
      response kernels.  Test both direct-terminal joint bounds and attainable
      endpoint-only bounds, including a five-state first mediator.
    parity: >
      Three direct-terminal reference worlds matched at all six endpoints with
      maximum absolute delta 7.82e-10; the indirect attainable lower endpoint
      matched exactly at 0.39.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    decision: reject
    reason: >
      The new owner correctly replaced the generic failure for both the large
      upstream-combination class and the five-state endpoint-only class, but
      neither produced an additional five-second certificate.

  - id: joint-shared-boundary-stratified-frechet
    change: >
      Condition jointly on every shared variable that directly enters the
      treatment-affected ancestor subgraph, and intersect the resulting exact
      stratum-wise Frechet bounds with the unstratified outer interval.
    shadow:
      tighter_than_best_single_variable: 16
      best_single_width_median: 0.10189874866137845
      joint_boundary_width_median: 0.082871797884851
      maximum_joint_strata: 12800
      outer_intervals_within_endpoint_tolerance: 0
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 413.2863222002634
    p95_seconds: 145.66205309994984
    decision: reject
    reason: >
      The strictly tighter valid outer interval did not improve closure and
      the joint projection substantially increased tail latency.

  - id: sharp-leaf-transport-message-boxes
    change: >
      Whenever a leaf contraction is a numeric cost against one affected
      response kernel, solve the complete child-state transportation problem
      and use its sharp minimum and maximum as the message variable bounds.
    parity:
      Eighty random two- through five-state transports matched the existing
      exact SCIP transport owner with maximum absolute delta 3.89e-16; the
      focused 58-test suite passed.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 346.4382802002947
    p95_seconds: 125.03937959996983
    decision: reject
    reason: >
      Sharp local transport boxes did not improve a global endpoint
      certificate, confirming that entrywise message bounds are not the
      remaining shared-mechanism convexification.

  - id: unlimited-bilinear-auxiliary-expressions
    change: >
      Remove SCIP's default cap of ten auxiliary expressions registered per
      bilinear term, allowing the official nonlinear handler to retain every
      repeated auxiliary occurrence in the shared message circuit.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 417.75295619975077
    p95_seconds: 147.62195030000294
    decision: reject
    reason: >
      Full auxiliary registration did not improve a certificate and increased
      root-processing latency, so the default cap is not the missing joint
      convexification.

  - id: safe-min-fill-formulation-portfolio
    change: >
      Compare the original reverse-topological circuit with the exact
      minimum-fill circuit only on its regression-safe class: no dynamic
      response blocks and at least three affected mechanisms.  Measure the
      closure-set union without emitting instance identities.
    parity: >
      The restricted alternate formulation passed the focused 58-test suite;
      the unrestricted historical formulation reproduced an LP numerical
      failure on the dynamic-pricing regression and was excluded.
    contingency:
      both_closed: 23
      baseline_only: 0
      alternate_only: 0
      both_unresolved: 7
    observed_working_set_bytes: 1719173120
    decision: reject
    reason: >
      The two exact formulations had identical closure sets, so a concurrent
      portfolio cannot increase frozen-distribution coverage and duplicates a
      large model build.

  - id: two-mechanism-kernel-product-rlt
    change: >
      For complete two-response-mechanism classes, expand the twin objective
      into kernel-pair products, keep every original nonlinear product
      equality, and add both mechanisms' exact row- and column-marginal RLT
      identities to couple all messages that reuse those kernels.
    parity: >
      Formal query-truth regression passed 32/32.  Solver endpoint checks
      passed; one legacy test rejected the intentionally different internal
      auxiliary-variable count rather than an endpoint value.
    bounded_variant:
      maximum_product_cells: 10000
      distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
      total_seconds: 371.8300429000519
      p95_seconds: 20.266887700010557
    wider_variant:
      maximum_product_cells: 100000
      observed_working_set_bytes: 1720123392
      decision: abort_before_cohort
    decision: reject
    reason: >
      Complete first-level kernel RLT did not add a certificate in its
      runnable structural class, while one wider complete lift exhausted the
      practical model-construction envelope before useful solving.

  - id: nonroot-shared-response-separator
    change: >
      Generalize exact shared-root state decomposition to every non-root shared
      variable that directly indexes all treatment-affected response
      mechanisms.  Each stratum retains the separator as evidence, including
      its correlation with shared ancestors, and uses disjoint response-context
      components that can be glued into one legal Markovian mechanism law.
    parity: >
      A non-root separator with a shared ancestor that also directly enters the
      outcome matched the unsplit exact owner at both endpoints.  The candidate
      source passed 72 focused query, solver, and scoring tests with one existing
      skip.
    structural_subcohort:
      size: 6
      baseline_closed: 5
      candidate_closed: 4
      baseline_total_seconds: 13.736705500050448
      candidate_total_seconds: 27.26925690000644
    decision: reject_before_full_cohort
    reason: >
      The exact state decomposition duplicated global model construction and
      lost one five-second certificate on the complete eligible class.  Its
      runtime and closure regression reject both production routing and a
      threshold-based dispatch patch.

  - id: hamming-one-multicolumn-response-pricing
    change: >
      After each exact response MAP call, evaluate the complete Hamming-one
      neighborhood of the optimal response and add every unseen response with
      a rigorously negative reduced cost in the same reduced-cost round.
    parity: >
      Endpoint values continued to match the explicit response owner.  One
      lifecycle test exposed that SCIP may issue an empty Farkas callback after
      an already closed reduced-cost round; no endpoint mismatch occurred.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 310.86684779979987
    p95_seconds: 21.220590999990236
    aggregate_pricing:
      baseline_closed_failures: 3
      candidate_closed_failures: 2
      baseline_incomplete_failures: 4
      candidate_incomplete_failures: 5
    decision: reject
    reason: >
      Extra improving columns enlarged the nonlinear master without completing
      pricing or moving the lagging global dual.  Incomplete pricing is a
      consequence of the root solve, not a one-column-per-round bottleneck.

  - id: exact-junction-tree-response-polytope
    change: >
      Triangulate each cyclic response-context graph and replace its complete
      response table by exact clique marginals with junction-separator
      consistency.  Running intersection makes this an exact projection of a
      full response-function law, with size exponential in induced graph width
      instead of context count.
    parity: focused solver regression passed 26/26
    variants:
      - maximum_bag_cells: 100000
        distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
        total_seconds: 485.7673035999178
        p95_seconds: 152.1899715999607
      - maximum_bag_cells: 3125
        distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
        total_seconds: 460.41418419993715
        p95_seconds: 176.68443910003407
    decision: reject
    reason: >
      Exact local response expansion removed no frozen failure and made the
      global nonlinear master substantially slower at both existing resource
      boundaries.  The remaining gap is cross-mechanism, not a missing compact
      owner for one cyclic response polytope.

  - id: response-kernel-frechet-lower-bounds
    change: >
      Give every pair-response kernel its exact marginal Frechet lower bound
      max(0, p_left + p_right - 1), instead of the generic zero lower bound.
      This preserves every response law and directly tightens subsequent
      nonnegative products without adding variables.
    parity: focused solver, query, and scoring regression passed 71/71 with one skip
    variants:
      - name: kernel-lower-only
        distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
        total_seconds: 194.47600470006
        p95_seconds: 23.285250999964774
      - name: kernel-lower-plus-projected-hidden-rlt
        distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
        total_seconds: 341.047469499812
        p95_seconds: 108.59522149997065
      - name: kernel-lower-plus-bilinear-aware-order
        distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
        total_seconds: 138.61067660007393
        p95_seconds: 17.712751400016714
        tolerance_gap_ratio:
          greater_than_100: 2
          between_10_and_100: 2
          between_2_and_5: 2
          between_1_and_2: 1
      - name: kernel-lower-plus-bilinear-order-plus-message-lower-bounds
        distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
        total_seconds: 200.08146579988534
        p95_seconds: 51.91430030000629
    decision: reject_for_closure_goal
    reason: >
      Exact kernel boxes plus the smaller circuit substantially improved
      runtime and moved two failures out of the greater-than-100 tolerance-gap
      bucket, but added no certificate.  Official first-level RLT and propagated
      message boxes both increased work without closing the remaining factor-2
      endpoint.  The missing relaxation is higher-order shared-mechanism
      consistency rather than another scalar bound.

  - id: full-twin-outcome-partition-consistency
    change: >
      On static-response joint owners, build two disjoint complement outcome
      rectangles with the same response mechanisms and enforce that the target
      rectangle plus both complements sums to one.  This adds a higher-order
      cross-mechanism probability-conservation identity without changing the
      target event or compatible SCM set.
    parity: focused solver, query, and scoring regression passed 71/71 with one skip
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 427.608200900082
    p95_seconds: 151.39090930001112
    decision: reject
    reason: >
      Duplicating the two complement circuits made the static nonlinear master
      substantially larger but did not move a frozen endpoint into tolerance.
      Full outcome conservation is valid but must be separated implicitly, not
      materialized as two additional arithmetic circuits.

  - id: binary-forest-credal-fast-path-coverage
    change: >
      Before implementing a 2U or forest-message owner, classify the complete
      frozen cohort by relabeling-invariant response-context structure while
      retaining the unchanged exact owner solely to label closure.
    aggregate_coverage:
      unresolved: 7
      all_binary: 0
      all_response_components_forest: 0
      all_binary_and_forest: 0
      terminal_reduced_lower_binary_and_forest: 0
      terminal_reduced_upper_binary_and_forest: 0
    decision: reject_before_implementation
    reason: >
      The polynomial binary-polytree and exact forest-coupling classes cover no
      unresolved endpoint, so they cannot improve the frozen closure metric.

  - id: upstream-continuous-product-flower-cuts
    change: >
      Enable SCIP's official flower separator on the existing continuous
      product expressions.  This adds valid multilinear-polytope consistency
      inequalities without changing the model or compatible mechanisms.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 438.3747823997983
    p95_seconds: 153.25630989996716
    decision: reject
    reason: >
      Product-hypergraph flower cuts added no certificate and consumed most of
      the root budget on the tail.

  - id: upstream-edge-concave-row-aggregation
    change: >
      Enable SCIP's official edge-concave separator with its upstream default
      aggregation and cut parameters, allowing multiple quadratic rows to
      expose odd signed cycles absent from each matching-shaped row alone.
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 430.3364586997777
    p95_seconds: 151.6453231999767
    decision: reject
    reason: >
      Cross-row edge-concave aggregation added no certificate and substantially
      worsened tail latency.

  - id: factual-event-complement-partition
    change: >
      For every joint individual-counterfactual owner, build only the disjoint
      complement inside the factual event and impose the exact identity
      P(A and B) + P(A and not B) = P(A), where the single-world factual mass
      is fixed by the CPT-World.  This replaces the earlier two-complement
      partition of the full twin outcome space by one directly relevant
      auxiliary circuit.
    parity: focused solver, query, and scoring regression passed 70/70 with one skip
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 419.17202680004993
    p95_seconds: 43.14709489996312
    decision: reject
    reason: >
      The conditional partition is exact and substantially cheaper than the
      earlier full two-complement construction, but duplicating even one full
      elimination circuit added no frozen certificate.

  - id: two-mechanism-forest-vertex-coverage
    change: >
      Classify failed owners by their actual response-mechanism count and by
      whether one complete local response polytope can be enumerated as the
      vertices of independent forest transports.  The classification uses
      only relabeling-invariant component structure.
    aggregate_coverage:
      unresolved: 7
      actual_two_mechanism_owners: 3
      two_mechanism_owners_with_one_all_forest_side: 3
      enumerable_all_forest_sides: 0
      minimum_complete_vertex_count: 1000000
    decision: reject_before_implementation
    reason: >
      Every two-mechanism failure has one cyclic side and one forest side, but
      even the smaller forest side is the Cartesian product of five or more
      nontrivial transport polytopes and exceeds one million complete vertices.
      Enumerating either mechanism cannot fit the five-second contract.

  - id: principal-moment-square-lift
    change: >
      For every probability variable that actually appears in a product,
      expose the redundant exact equality q = x squared.  This supplies SCIP's
      upstream principal-minor separator with shared square moments, allowing
      repeated products of one kernel or elimination message to participate in
      positive-semidefinite moment cuts without changing the feasible set.
    parity: focused solver, query, and scoring regression passed 70/70 with one skip
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 432.09187659970485
    p95_seconds: 49.31725079996977
    decision: reject
    reason: >
      The compact square lift added no frozen certificate and increased both
      total runtime and tail latency.  Principal second-order moment
      consistency does not recover the higher-order response-marginal
      equalities missing from the current relaxation.

  - id: upstream-rank-one-interminor-cuts
    change: >
      Combine the exact square lift with SCIP's otherwise disabled upstream
      interminor separator at the root.  Unlike principal semidefinite minor
      cuts, this separator uses intersection cuts for zero 2-by-2 determinants
      of the auxiliary product matrix and therefore targets rank-one product
      consistency directly.
    parity: focused solver, query, and scoring regression passed 70/70 with one skip
    distribution: {closed: 23, exact: 22, epsilon_sharp: 1, unresolved: 7}
    total_seconds: 432.9455081997439
    p95_seconds: 152.4693019000115
    decision: reject
    reason: >
      Rank-one intersection cuts added no frozen certificate and consumed the
      root budget on the tail.  Generic product-matrix consistency still does
      not transmit the response-function marginal equalities through nested
      elimination messages.
